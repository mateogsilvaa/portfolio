<style>

  opacity: 0; transform: scale(.92); transition: opacity .25s, transform .35s var(--ease); }

.os.busy iframe { pointer-events: none; }
.os.busy, .os.busy * { user-select: none; }

/* Navegador */
.w--web .w__bar { background: #2a2a2c; border-color: #1b1b1c; }

.w--term .w__bar { background: #2a2a2c; border-color: #111; }

/* Móvil: ventanas a pantalla completa, sin arrastrar (solo el escritorio real) */
@media (max-width: 760px) {

<script>
/* ---------------- Datos de cada proyecto ---------------- */
const APPS = [
  { id: "mundo-atletismo", name: "Mundo Atletismo", k: "MA", url: "https://mundoatletismo.es", c: "#f1e2c8", t: "#1a1206",
    role: "Cofundador · 2026 — hoy",

    body: `<h3>Qué es</h3>
      <p>Una base de datos pública del atletismo español. Reúne lo que antes estaba repartido en actas y webs de cada temporada y lo convierte en rankings, fichas y estadísticas que se actualizan solas.</p>
      <h3>Qué encuentras</h3>
      <ul>
        <li><b>Ranking nacional</b> de cada prueba, por año y categoría, y un <b>ranking por puntos</b> para comparar pruebas distintas en la misma escala.</li>
        <li><b>Campeonatos de España</b> absolutos y sub: finales, semifinales y récords de campeonato.</li>
        <li><b>Fichas de atleta</b> con trayectoria, progresión año a año y comparativas.</li>
        <li><b>Internacionales:</b> quién tiene la mínima para Mundiales, Europeos y Juegos Olímpicos.</li>
        <li><b>Clubes</b> con su cantera por categoría y prueba, y <b>pistas</b> con su información.</li>
        <li><b>Novedades de la semana:</b> récords de España, las mejores marcas por puntos y las mínimas conseguidas.</li>
        <li><b>Curiosidades</b>, un <b>arcade</b> con un juego nuevo cada día y una web aparte con resultados en directo.</li>
      </ul>
      <h3>Para quién</h3>
      <p>Atletas, entrenadores, clubes, familias y aficionados que quieren saber cómo está una prueba, un atleta o un club sin bucear entre PDFs.</p>`,
    stats: [["6,1 M", "marcas"], ["242.574", "atletas"], ["3.221", "clubes"], ["2.410", "pistas"]],
    stack: ["React", "TypeScript", "Vite", "Firebase"] },
  { id: "lanedata", name: "Lanedata", k: "L", url: "https://lanedata.es", c: "#0f3a22", t: "#eaf5ec",
    role: "Fundador · 2026 — hoy",
    one: "El atletismo español contado con datos: periodismo que responde preguntas con resultados reales.",
    body: `<h3>Qué es</h3>
      <p>Un medio de análisis. Cada pieza parte de una pregunta sobre el atletismo español y la contesta con los resultados de la RFEA, con estadística sencilla: medianas, porcentajes de mejora o el seguimiento de una misma generación durante años.</p>

      <ul>
        <li><b>Carreras deportivas:</b> a qué edad se deja de mejorar, o si los prodigios juveniles acaban llegando a la élite.</li>
        <li><b>Historias:</b> clubes, equipos y atletas cuya trayectoria se explica mejor con números.</li>
        <li><b>Actualidad:</b> competiciones y temas del momento, con el contexto de los datos.</li>
      </ul>
      <h3>Cómo se navega</h3>
      <p>La portada destaca el último análisis y el dato de la semana. Hay archivo completo, buscador y categorías, y enlaza con los rankings de Mundo Atletismo.</p>

      <p>Next.js y TypeScript sobre Supabase, con un panel propio para escribir y publicar. Idea, datos, texto y desarrollo: todo mío.</p>`,

  { id: "bicifastness", name: "Bicifastness", k: "B", url: "https://bicifastness.es", c: "#ffd400", t: "#1426a8",
    role: "Creador · 2026",
    one: "Una liga para quien se mueve en BiciMAD: tu trayecto de cada día suma puntos. Madrid es el circuito.",
    body: `<h3>Qué es</h3>
      <p>Un juego que convierte la bici compartida de Madrid en competición, para que moverse en bici tenga un motivo más. No hace falta cambiar de ruta ni ir más rápido: cuenta lo que ya haces.</p>
      <h3>Cómo funciona</h3>
      <ul>
        <li><b>Te registras</b> con Google o con tu correo y eliges un nombre de piloto. Tu nombre real no se publica.</li>
        <li><b>Haces tu trayecto</b> en BiciMAD y <b>subes la captura</b>.</li>
        <li><b>Sumas puntos</b> por distancia, ritmo y constancia. Cada día seguido que pedaleas, tu racha multiplica los puntos hasta ×1,5.</li>

        <li><b>Temporadas de un mes:</b> cada mes todo vuelve a cero.</li>
      </ul>
      <p class="small">Proyecto independiente, sin relación con BiciMAD, la EMT ni el Ayuntamiento de Madrid.</p>`,
    stats: [["30", "rivales por división"], ["×1,5", "multiplicador de racha"], ["3", "clasificaciones"], ["1 mes", "por temporada"]] },
  { id: "tripfinder", name: "Tripfinder", k: "T", url: "https://tripfinder.es", c: "#1b1b1b", t: "#f3f1ec",
    role: "Creador · 2026",
    one: "Vuelos baratos antes que nadie: escapadas desde Madrid que cuestan menos de lo normal.",
    body: `<h3>Qué es</h3>
      <p>Un buscador de chollos de fin de semana. Revisa precios cada 12 horas en todas las compañías, no solo las de bajo coste, y solo enseña los viajes que están más baratos de lo habitual.</p>
      <h3>Qué puedes hacer</h3>
      <ul>
        <li><b>Chollos:</b> el feed del día, filtrable por destino, precio máximo, zona, hora de salida y número de viajeros.</li>
        <li><b>Buscar:</b> a cualquier sitio o a uno concreto, en un finde al azar, un mes entero, unos días de la semana o fechas exactas, hasta un año vista. También busca dónde dormir.</li>
        <li><b>Avisos:</b> sigues un vuelo, pones un precio y te escribe cuando baja de él.</li>
        <li><b>Viajar en grupo:</b> compartes un viaje con un enlace, lo mandas a un HOP (un espacio donde el grupo vota) y lo añades al calendario.</li>
      </ul>
      <p>La cuenta es gratis, no hay anuncios y los correos solo llegan si los activas.</p>
      <h3>Cómo está hecho</h3>
      <p>El rastreador está en Python y se ejecuta solo con GitHub Actions; la web, en JavaScript con Firebase. Probado con pytest y Playwright.</p>`,
    stats: [["12 h", "entre revisiones"], ["1 año", "vista en el buscador"], ["1 — 6", "viajeros"], ["0", "anuncios"]],
    stack: ["Python", "JavaScript", "Firebase", "GitHub Actions"] },
];
const README = { id: "leeme", name: "Léeme", one: "Bienvenido a mi escritorio.",
  body: `<p>Aquí están mis cuatro proyectos. Todos son webs reales y funcionan dentro de cada ventana.</p>
    <h3>Cómo se usa</h3>
    <ul>
      <li><b>Abre</b> un proyecto desde el escritorio o desde el Dock.</li>
      <li><b>Mueve</b> las ventanas arrastrando su barra y <b>cambia su tamaño</b> desde la esquina de abajo a la derecha.</li>
      <li>Los botones de colores <b>cierran</b>, <b>minimizan</b> y <b>maximizan</b>.</li>
      <li>Cada proyecto tiene su <b>nota</b> en esta app, y en la <b>Terminal</b> puedes escribir <code>help</code>.</li>
    </ul>` };

/* ---------------- Escritorio (también se usa como maqueta en la intro) ---------------- */
const IC_NOTES = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>`;
const IC_TERM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 4 4-4 4M12 16h7"/></svg>`;
const deskHTML = (mock) => `
  <div class="os__menu"><b>MGS</b><span class="app">Finder</span><span class="dim">Archivo</span><span class="dim">Edición</span><span class="dim">Ventana</span>
    <span class="r"><span class="dim">Madrid</span><time class="clock"></time>${mock ? "" : `<button type="button" class="os__site">Menú</button>`}</span></div>
  <div class="os__icons">
    ${APPS.map((a) => `<button type="button" class="dico" data-open="${a.id}"><span class="dico__i" style="--c:${a.c};--t:${a.t}">${a.k}</span><span>${a.name}</span></button>`).join("")}
    <button type="button" class="dico" data-open="notes:leeme"><span class="dico__i doc">TXT</span><span>Léeme.txt</span></button>
  </div>
  <nav class="os__dock${mock ? " static" : ""}">
    <a class="dk" href="/" style="--c:#2b45ff;--t:#fff" aria-label="Inicio">M<span class="tip">Volver al inicio</span></a>
    <span class="dk dk--sep"></span>
    ${APPS.map((a) => `<button type="button" class="dk" data-open="${a.id}" style="--c:${a.c};--t:${a.t}" aria-label="${a.name}">${a.k}<span class="tip">${a.name}</span></button>`).join("")}
    <span class="dk dk--sep"></span>
    <button type="button" class="dk" data-open="notes" style="--c:#f7d774;--t:#5a4300" aria-label="Notas">${IC_NOTES}<span class="tip">Notas</span></button>
    <button type="button" class="dk" data-open="term" style="--c:#1b1b1b;--t:#67d48a" aria-label="Terminal">${IC_TERM}<span class="tip">Terminal</span></button>
  </nav>`;
const os = document.querySelector(".os--real");
os.innerHTML = deskHTML(false);
document.querySelector(".os--mock").innerHTML = deskHTML(true);

/* ---------------- Gestor de ventanas ---------------- */
const MENU_H = 30, DOCK_H = 84;
const wins = {}; let Z = 10;
const mobile = () => innerWidth <= 760;
const area = () => ({ w: os.clientWidth, h: os.clientHeight - MENU_H - DOCK_H });
const appName = { notes: "Notas", term: "Terminal" };
const syncDock = () => {
  os.querySelectorAll(".os__dock [data-open]").forEach((d) => {
    const k = d.dataset.open; d.classList.toggle("run", !!(wins["web:" + k] || wins[k]));
  });
};
const focus = (w) => {
  Object.values(wins).forEach((x) => x.el.classList.remove("focus"));
  w.el.classList.add("focus"); w.el.style.zIndex = ++Z;
  os.querySelector(".os__menu .app").textContent = w.app;
};
const makeWin = (key, { title, cls, x, y, w, h, html, app, tools = "" }) => {
  if (wins[key]) { restore(wins[key]); focus(wins[key]); return wins[key]; }
  const el = document.createElement("div");
  el.className = "w " + cls;
  el.innerHTML = `<div class="w__bar"><div class="w__dots"><button type="button" data-a="close" aria-label="Cerrar"></button><button type="button" data-a="min" aria-label="Minimizar"></button><button type="button" data-a="max" aria-label="Maximizar"></button></div><div class="w__title">${title}</div><div class="w__tools">${tools}</div></div><div class="w__body">${html}</div><div class="w__rs"></div>`;
  const A = area();
  w = Math.min(w, A.w - 20); h = Math.min(h, A.h - 10);
  x = Math.max(6, Math.min(x, A.w - w - 6)); y = Math.max(MENU_H + 6, Math.min(y, MENU_H + A.h - h));
  Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", zIndex: ++Z });
  os.append(el);
  const win = { key, el, app, max: false, prev: null };
  wins[key] = win;
  requestAnimationFrame(() => el.classList.add("in"));
  el.addEventListener("pointerdown", () => focus(win));
  el.querySelector('[data-a="close"]').addEventListener("click", (e) => { e.stopPropagation(); closeWin(win); });
  el.querySelector('[data-a="min"]').addEventListener("click", (e) => { e.stopPropagation(); minimize(win); });
  el.querySelector('[data-a="max"]').addEventListener("click", (e) => { e.stopPropagation(); toggleMax(win); });
  el.querySelector(".w__bar").addEventListener("dblclick", (e) => { if (!e.target.closest("button, a")) toggleMax(win); });
  drag(win); resize(win); focus(win); syncDock();
  return win;
};
const closeWin = (w) => { w.el.classList.add("out"); setTimeout(() => w.el.remove(), 250); delete wins[w.key]; syncDock(); };
const dockIconFor = (w) => os.querySelector(`.os__dock [data-open="${w.key.replace("web:", "")}"]`);
const minimize = (w) => {
  const d = dockIconFor(w), r = w.el.getBoundingClientRect();
  if (d) { const q = d.getBoundingClientRect(); w.el.style.setProperty("--mx", q.left + q.width / 2 - (r.left + r.width / 2) + "px"); w.el.style.setProperty("--my", q.top - (r.top + r.height / 2) + "px"); }
  w.el.classList.add("mini"); w.mini = true;
};
const restore = (w) => { if (w.mini) { w.el.classList.remove("mini"); w.mini = false; } };
const toggleMax = (w) => {
  if (mobile()) return;
  const s = w.el.style; w.el.classList.add("anim");
  if (!w.max) { w.prev = { left: s.left, top: s.top, width: s.width, height: s.height }; Object.assign(s, { left: "0px", top: MENU_H + "px", width: os.clientWidth + "px", height: os.clientHeight - MENU_H - DOCK_H + "px" }); }
  else Object.assign(s, w.prev);
  w.max = !w.max; setTimeout(() => w.el.classList.remove("anim"), 380);
};
const drag = (w) => {
  const bar = w.el.querySelector(".w__bar"); let st = null;
  bar.addEventListener("pointerdown", (e) => {
    if (mobile() || e.button !== 0 || e.target.closest("button, a")) return;
    st = { x: e.clientX, y: e.clientY, l: w.el.offsetLeft, t: w.el.offsetTop }; bar.setPointerCapture(e.pointerId); os.classList.add("busy");
  });
  bar.addEventListener("pointermove", (e) => {
    if (!st) return; if (w.max) { w.max = false; }
    const l = Math.max(-w.el.offsetWidth + 90, Math.min(os.clientWidth - 90, st.l + e.clientX - st.x));
    const t = Math.max(MENU_H, Math.min(os.clientHeight - 60, st.t + e.clientY - st.y));
    w.el.style.left = l + "px"; w.el.style.top = t + "px";
  });
  const end = () => { st = null; os.classList.remove("busy"); };
  bar.addEventListener("pointerup", end); bar.addEventListener("pointercancel", end);
};
const resize = (w) => {
  const h = w.el.querySelector(".w__rs"); let st = null;
  h.addEventListener("pointerdown", (e) => { e.stopPropagation(); st = { x: e.clientX, y: e.clientY, w: w.el.offsetWidth, h: w.el.offsetHeight }; h.setPointerCapture(e.pointerId); os.classList.add("busy"); focus(w); });
  h.addEventListener("pointermove", (e) => {
    if (!st) return;
    w.el.style.width = Math.max(300, Math.min(os.clientWidth - w.el.offsetLeft, st.w + e.clientX - st.x)) + "px";
    w.el.style.height = Math.max(200, Math.min(os.clientHeight - w.el.offsetTop, st.h + e.clientY - st.y)) + "px";
  });
  const end = () => { st = null; os.classList.remove("busy"); };
  h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
};

/* ---------------- Apps ---------------- */
let opened = 0;
const openProject = (id) => {
  const a = APPS.find((x) => x.id === id); if (!a) return;
  const A = area(), i = APPS.indexOf(a);
  const bw = Math.round(A.w * .6), bh = Math.round(A.h * .86);
  const bx = Math.round(A.w * .05) + i * 26, by = MENU_H + 18 + i * 22;
  const existed = !!wins["web:" + id];
  const w = makeWin("web:" + id, {
    title: a.url.replace("https://", ""), cls: "w--web", app: a.name, x: bx, y: by, w: bw, h: bh,
    tools: `<button type="button" data-note="${id}">Notas</button><a href="${a.url}" target="_blank" rel="noopener">Abrir ↗</a>`,
    html: `<iframe src="${a.url}" title="${a.name}" loading="eager"></iframe><div class="load">Cargando ${a.name}…</div>`,
  });
  if (!existed) {
    const f = w.el.querySelector("iframe"), l = w.el.querySelector(".load");
    const done = () => l.classList.add("off"); f.addEventListener("load", () => setTimeout(done, 300)); setTimeout(done, 8000);
    w.el.querySelector("[data-note]").addEventListener("click", () => openNotes(id));
  }
  if (!mobile()) openNotes(id, { x: bx + bw - 30, y: by + 40, h: bh - 40 });
  focus(w); opened++;
};
const NOTES = [README, ...APPS];
const noteHTML = (n) => n.id === "leeme"
  ? `<time>Hoy</time><h2>${n.name}</h2><p class="one">${n.one}</p>${n.body}`
  : `<time>${n.role}</time><h2>${n.name}</h2><p class="one">${n.one}</p>
     <div class="kv">${n.stats.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("")}</div>
     ${n.body}${n.stack ? `<h3>Stack</h3><div class="tags">${n.stack.map((s) => `<span>${s}</span>`).join("")}</div>` : ""}
     <a class="go" href="${n.url}" target="_blank" rel="noopener">Visitar ${n.url.replace("https://", "")} ↗</a>`;
const openNotes = (id = "leeme", pos) => {
  const A = area();
  const p = pos || { x: A.w - 600, y: MENU_H + 40, h: A.h * .8 };
  const w = makeWin("notes", {
    title: "Notas", cls: "w--notes", app: "Notas", x: p.x, y: p.y, w: 560, h: p.h,
    html: `<div class="notes__list">${NOTES.map((n) => `<button type="button" data-n="${n.id}">${n.name}<small>${n.id === "leeme" ? "Cómo usar el escritorio" : n.role}</small></button>`).join("")}</div><div class="notes__doc"></div>`,
  });
  if (!w.wired) { w.wired = true; w.el.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => showNote(w, b.dataset.n))); }
  showNote(w, id); focus(w);
};
const showNote = (w, id) => {
  const n = NOTES.find((x) => x.id === id) || README;
  w.el.querySelectorAll("[data-n]").forEach((b) => b.classList.toggle("on", b.dataset.n === n.id));
  const d = w.el.querySelector(".notes__doc"); d.innerHTML = noteHTML(n); d.scrollTop = 0;
};
const plain = (html) => { const d = document.createElement("div"); d.innerHTML = html.replace(/<li>/g, "<li>  · "); return d.innerText.replace(/\n{3,}/g, "\n\n").trim(); };
const openTerm = () => {
  const A = area();
  const w = makeWin("term", { title: "mateo — zsh", cls: "w--term", app: "Terminal", x: A.w * .18, y: MENU_H + A.h * .22, w: 620, h: 380,
    html: `<div class="term__out"></div><label class="term__line"><span>mateo@mgs ~ %</span><input type="text" autocomplete="off" spellcheck="false" aria-label="Comando"></label>` });
  const body = w.el.querySelector(".w__body"), out = w.el.querySelector(".term__out"), inp = w.el.querySelector("input");
  const say = (t, c = "") => { const d = document.createElement("div"); d.className = c; d.textContent = t; out.append(d); body.scrollTop = body.scrollHeight; };
  if (!w.wired) {
    w.wired = true;
    say("Último inicio de sesión: hoy en mateogsilvaa.es", "m");
    say("Escribe help para ver los comandos.", "m");
    const ids = APPS.map((a) => a.id);
    const find = (q) => APPS.find((a) => a.id.startsWith(q) || a.name.toLowerCase().startsWith(q) || a.k.toLowerCase() === q);
    inp.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const v = inp.value.trim(); inp.value = ""; say("mateo@mgs ~ % " + v, "c");
      const [cmd, ...rest] = v.toLowerCase().split(/\s+/), arg = rest.join(" ");
      if (!cmd) return;
      if (cmd === "help") say("ls                 lista mis proyectos\ncat <proyecto>     explica un proyecto\nopen <proyecto>    abre la web\nwhoami             quién soy\ncontacto           cómo escribirme\nclear              limpia la pantalla");
      else if (cmd === "ls") say(APPS.map((a) => a.id.padEnd(18) + a.url.replace("https://", "")).join("\n"), "g");
      else if (cmd === "whoami") say("Mateo González Silva. Ingeniería Informática + IA en la UFV, atleta y\nfundador de Lanedata. Construyo productos con datos.");
      else if (cmd === "contacto") say("contacto@mateogsilvaa.es · linkedin.com/in/mateo-gonzález-silva");
      else if (cmd === "clear") out.innerHTML = "";
      else if (cmd === "cat" || cmd === "open") {
        const a = find(arg); if (!a) return say(`${cmd}: ${arg || "?"}: no existe. Prueba con: ${ids.join(", ")}`, "m");
        if (cmd === "open") { say("Abriendo " + a.url + " …", "g"); openProject(a.id); }
        else say(`${a.name.toUpperCase()} — ${a.url.replace("https://", "")}\n${a.one}\n\n${plain(a.body)}`);
      } else say(`zsh: comando no encontrado: ${cmd}`, "m");
    });
    body.addEventListener("pointerup", () => { if (!getSelection().toString()) inp.focus(); });
  }
  setTimeout(() => inp.focus({ preventScroll: true }), 80);
};
const launch = (k) => {
  if (k === "notes") return openNotes();
  if (k.startsWith("notes:")) return openNotes(k.slice(6));
  if (k === "term") return openTerm();
  const w = wins["web:" + k];
  if (w && w.mini) { restore(w); focus(w); return; }
  openProject(k);
};
os.addEventListener("click", (e) => {
  const t = e.target.closest("[data-open]"); if (!t) return;
  launch(t.dataset.open);
});
os.querySelector(".os__site").addEventListener("click", () => document.querySelector(".burger").click());

/* Oculta la cabecera de la web cuando el escritorio ocupa la pantalla */
new IntersectionObserver(([e]) => document.body.classList.toggle("os-on", e.intersectionRatio > .6), { threshold: [0, .6, 1] }).observe(os);

/* Llegar con #proyecto: baja al escritorio y lo abre */
addEventListener("load", () => {
  const id = location.hash.slice(1);
  if (APPS.some((a) => a.id === id)) { os.scrollIntoView(); setTimeout(() => openProject(id), 300); }
  else if (id === "escritorio") os.scrollIntoView();
});

/* ---------------- Intro con scroll ---------------- */
(() => {
  const intro = document.querySelector(".intro"); if (getComputedStyle(intro).display === "none") return;
  const mac = intro.querySelector(".mac"), screen = intro.querySelector(".mac__screen"), view = intro.querySelector(".mac__view");
  const vs = intro.querySelector(".vscreen"), web = intro.querySelector(".fakeweb"), hint = intro.querySelector(".scrollhint");
  const icons = [...intro.querySelectorAll(".os--mock .dico")], caps = [...intro.querySelectorAll(".caption p")];
  const clamp = (v) => Math.max(0, Math.min(1, v)), seg = (p, a, b) => clamp((p - a) / (b - a));
  const ease = (t) => 1 - Math.pow(1 - t, 3), inout = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  let sw = 0, s0 = 1, raf = 0;
  const layout = () => {
    sw = Math.min(1100, innerWidth * (innerWidth < 760 ? .9 : .7));
    mac.style.setProperty("--sw", sw + "px");
    const sh = sw * 10 / 16, pad = screen.offsetWidth ? (screen.offsetWidth - view.offsetWidth) : sw * .026;
    s0 = (innerWidth < 760 ? innerWidth / (sw - pad) : Math.max(innerWidth / (sw - pad), innerHeight / (sh - pad))) * 1.01;
    vs.style.transform = `scale(${view.offsetWidth / 1440})`;
    run();
  };
  const run = () => {
    raf = 0;
    const r = intro.getBoundingClientRect(), p = clamp(-r.top / (r.height - innerHeight));
    // 1) la web encoge hasta verse dentro del Mac  2) se cierra  3) aparecen los iconos  4) zoom a la pantalla
    const a = inout(seg(p, .04, .3)), z = inout(seg(p, .8, 1));
    const sc = s0 + (1 - s0) * a + (s0 - 1) * z;
    mac.style.transform = `translate(-50%, -${50 + 0}%) translateY(${(1 - Math.max(1 - a, z)) * -2}%) scale(${sc})`;
    const c = ease(seg(p, .36, .56));
    web.style.transform = `translateY(${c * 38}%) scale(${1 - c * .9})`;
    web.style.opacity = 1 - seg(p, .5, .58);
    web.style.borderRadius = 10 + c * 30 + "px";
    icons.forEach((ic, i) => { const k = ease(seg(p, .58 + i * .03, .68 + i * .03)); ic.style.opacity = k; ic.style.transform = `translateY(${(1 - k) * 18}px) scale(${.85 + k * .15})`; });
    const step = p < .26 ? 0 : p < .38 ? 2 : p < .58 ? 3 : p < .8 ? 4 : 0;
    caps.forEach((cp) => cp.classList.toggle("on", +cp.dataset.k === step));
    hint.style.opacity = p < .02 ? 1 : 0;
  };
  addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(run); }, { passive: true });
  addEventListener("resize", layout);
  layout(); requestAnimationFrame(layout);
})();
</script>
